name: iOS build

on:
  push:
    branches: [main]
    # The APK/IPA commits made by the publish jobs must not start another build.
    paths-ignore: ['apk/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build the app (unsigned)
        run: |
          xcodebuild -project iosApp/Ironlog.xcodeproj -scheme Ironlog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package the IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Ironlog.app build/ipa/Payload/
          cd build/ipa && zip -qry ironlog-ios.ipa Payload
          ls -l ironlog-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ipa/ironlog-ios.ipa
          retention-days: 3

  # Replaces apk/ironlog-ios.ipa on main with the build that just succeeded.
  publish-ipa:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: ipa
          path: build-ipa
      - name: Commit the latest IPA
        run: |
          mkdir -p apk
          mv build-ipa/ironlog-ios.ipa apk/ironlog-ios.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ironlog-ios.ipa
          git diff --cached --quiet && exit 0
          git commit -m "Update apk/ironlog-ios.ipa to ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
