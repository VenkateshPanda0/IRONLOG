org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# iOS code is compiled (not linked) on Linux too, so shared code is checked without a Mac.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Lint bundled with AGP 8.7 cannot analyse Kotlin 2.1 code; use the newer lint release.
android.experimental.lint.version=8.10.1
